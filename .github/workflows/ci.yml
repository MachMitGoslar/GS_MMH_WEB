name: CI

on:
  pull_request:
    branches: [main, staging]
    # `edited`: changing the pull request description re-runs the visual check,
    # so a `Visual-Change:` line can be added afterwards.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Visual regression: ref to compare the selected branch against'
        default: origin/main
      content_ref:
        description: 'web_content commit to render with (empty = head of production)'
        default: ''

permissions:
  contents: read

concurrency:
  # Description edits run apart from code runs, so editing a pull request does
  # not cancel the checks of the latest push.
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer test

  frontend-lint:
    name: ESLint and Stylelint
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # HUSKY=0: no git hooks in CI
      - run: npm ci
        env:
          HUSKY: '0'

      - run: npm run lint:js

      - run: npm run lint:css

  php-style:
    name: PHP style (PHPCS)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    # Errors fail the job; warnings (long lines) are reported only.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer lint

  # The pages are rendered with the live content of web_content: the head of
  # `production` for code that goes to main, the head of `staging` otherwise.
  # The commit is resolved once per job, so every render of a run sees the same
  # content (a comparison of base and PR can never be skewed by an edit).
  smoke:
    name: Smoke tests (code + live content)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve content
        id: content
        env:
          TARGET: ${{ github.base_ref || github.ref_name }}
          OVERRIDE: ${{ inputs.content_ref }}
        run: |
          BRANCH=staging
          if [ "$TARGET" = "main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then BRANCH=production; fi
          REF=${OVERRIDE:-$(git ls-remote https://github.com/MachMitGoslar/web_content "refs/heads/$BRANCH" | cut -f1)}
          [ -n "$REF" ] || { echo "could not resolve web_content/$BRANCH"; exit 1; }
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Content: web_content/$BRANCH @ ${REF:0:7}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache@v4
        with:
          path: content
          key: content-${{ steps.content.outputs.ref }}

      - run: npm ci
        env:
          HUSKY: '0'

      - run: npx playwright install --with-deps chromium

      # Content and plugins follow the environment (production or staging)
      - run: tests/e2e/ci-smoke.sh
        env:
          ENV_BRANCH: ${{ steps.content.outputs.branch }}
          CONTENT_REF: ${{ steps.content.outputs.ref }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-results
          path: tests/e2e/.results
          if-no-files-found: ignore

  visual:
    name: Visual regression (PR vs. base)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve content
        id: content
        env:
          TARGET: ${{ github.base_ref }}
          OVERRIDE: ${{ inputs.content_ref }}
        run: |
          BRANCH=staging
          if [ "$TARGET" = "main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then BRANCH=production; fi
          REF=${OVERRIDE:-$(git ls-remote https://github.com/MachMitGoslar/web_content "refs/heads/$BRANCH" | cut -f1)}
          [ -n "$REF" ] || { echo "could not resolve web_content/$BRANCH"; exit 1; }
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Content: web_content/$BRANCH @ ${REF:0:7}" >> "$GITHUB_STEP_SUMMARY"

      # A pull request that changes the look on purpose says so in its
      # description, e.g. `Visual-Change: project, notes` or `Visual-Change: all`.
      # Only the listed pages may differ; everything else must stay the same.
      - name: Announced visual changes
        id: expected
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          LINE=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -iE '^[[:space:]]*visual-change[[:space:]]*:' | head -1 | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]+$//' || true)
          echo "pages=$LINE" >> "$GITHUB_OUTPUT"
          if [ -n "$LINE" ]; then echo "Announced visual changes: \`$LINE\`" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/cache@v4
        with:
          path: content
          key: content-${{ steps.content.outputs.ref }}

      - run: npm ci
        env:
          HUSKY: '0'

      - run: npx playwright install --with-deps chromium

      # Renders the base and the PR with the same content and compares them.
      - run: tests/e2e/ci-visual.sh "${{ github.event.pull_request.base.sha || inputs.base_ref }}" "${{ github.sha }}"
        env:
          ENV_BRANCH: ${{ steps.content.outputs.branch }}
          CONTENT_REF: ${{ steps.content.outputs.ref }}
          MMH_VISUAL_EXPECTED: ${{ steps.expected.outputs.pages }}

      # Also on success: announced changes keep their before/after/diff images.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: tests/e2e/.results
          if-no-files-found: ignore
