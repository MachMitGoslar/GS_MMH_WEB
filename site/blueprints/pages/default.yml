title: Standard Seite
icon: page

options:
  changeTemplate:
    - about

tabs:
  content:
    label: Inhalt
    icon: text
    columns:
      main:
        width: 2/3
        sections:
          fields:
            type: fields
            fields:
              cover: fields/cover
              headline:
                label: Titel
                type: text
              subheadline:
                label: Subtitel
                type: text
              text:
                type: writer
                label: Text
                toolbar:
                  inline: true
                  marks:
                    - bold
                    - button
              layout:
                extends: fields/layoutContent
                settings:
                  fields:
                    publish_date: fields/blockPublishDate
                    end_date: fields/blockEndDate

      sidebar:
        width: 1/3
        sections:
          pages:
            type: pages
            template: default
          files:
            type: files
            uploads: false

  schedule:
    label: Veröffentlichung
    icon: clock
    columns:
      main:
        sections:
          scheduling:
            type: fields
            fields:
              publish_date:
                label: Veröffentlichungsdatum
                type: date
                time: true
                default: now
              end_date:
                label: Enddatum
                type: date
                time: true

  seo: tabs/seo
