# Each page blueprint must have a title, the title may be different from the file name
title: Member

# Each page can have an icon that is shown in page listings when no preview image is available.
icon: user


create:
  title: '{{page.name}}'
  slug: '{{page.name.slug}}'
  fields:
    - name
    - teams
status:
  listed: true
  draft: true
  redirect: false


# Page options allow you to control how users can interact with the page.
# Here we prevent changing the page slug and page deletion
# More about page options: https://getkirby.com/docs/reference/panel/blueprints/page#options
options:
  #delete: false
  url: true
  status: true

# We use tabs here to focus on the layout in one tab
# and have the additional contact fields in a secondary
# tab. Tabs can really help to clean up the interface
# when it otherwise gets too complicated
tabs:
  content:
    label: Inhalt
    icon: text
    columns:
      - width: 2/3
        # The first column contains a set of fields to store
        # information about the album.
        #
        # List of all available field types:
        # https://getkirby.com/docs/reference/panel/fields
        fields:
          # If you need the same field in multiple locations, you can define them once and reuse whereever needed.
          # Here we use a files field defined in `/site/blueprints/field/cover.yml`
          cover: fields/cover
          name:
            type: text
            placeholder: Neue Person
            required: true
            label: Name
          description:
            type: textarea
            required: true
            label: Beschreibung
          role:
            type: text
            label: Beschäftigung
          email:
            type: text
            label: Email
          phone:
            type: text
            label: Telefon
          address:
            type: text
            label: Adresse
          geo:
            type: object
            label: Geokoordinaten
            fields:
              latitude:
                width: 1/2
                type: text
                default: 51.906169
                help: Dezimalgrad, z.B. 51.0504
                label: Breitengrad
              longitude:
                width: 1/2
                type: text
                default: 10.429327
                help: Dezimalgrad, z.B. 10.4234
                label: Längengrad
      - width: 1/3
        fields:
          teams:
            type: tags
            label: Teams
            options:
              - value: staff
                text: "Hauptamtliches Team"
              - value: volunteer
                text: "Ehrenamtliches Team"
              - value: partner
                text: "Partner"
              - value: issuer
                text: "Auftraggeber"
          facebook:
            type: text
            help: z.B. goslar.de
          instagram:
            type: text
            help: z.B. martin_saenger
          x:
            type: text
            help: oliver.kasties
          linkedin:
            type: text
            help: z.B. krauschristina
          github:
            type: text
            help: z.B. rangarius 
          youtube:
            type: text
            help: z.B. @Stadt.Goslar
          tags: true

  seo: tabs/seo
