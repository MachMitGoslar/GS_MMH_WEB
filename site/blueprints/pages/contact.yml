title: Kontaktseite
icon: phone

options:
  status: true
  delete: false
  duplicate: false

tabs:
  content:
    label: Inhalt
    icon: text
    columns:
      - width: 2/3
        sections:
          content:
            type: fields
            fields:
              intro:
                label: Einleitung
                type: textarea
                size: small

              email:
                label: E-Mail
                type: email

              phone:
                label: Telefonnummer
                type: tel

              website:
                label: Website
                type: url

              address:
                label: Adresse
                type: textarea
                size: small

              social:
                label: Social Media Handle
                type: text


              text:
                label: Zusätzliche Inhalte
                extends: fields/blocksContent

      - width: 1/3
        sections:
          map:
            type: fields
            fields:
              lat:
                label: Latitude
                type: number
                step: 0.000001

              lng:
                label: Longitude
                type: number
                step: 0.000001

              mapbox_token:
                label: Mapbox Access Token
                type: text

  seo: tabs/seo
