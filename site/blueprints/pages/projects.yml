title: Projekte
icon: images

tabs:
  content:
    label: Inhalt
    icon: text
    columns:
      - width: 2/3
        fields:
          cover: fields/cover

          headline:
            type: text
            placeholder: page.title
            required: true

          subheadline:
            label: Untertitel
            type: text

      - width: 1/3
        sections:
          topic_digitale_stadt:
            type: pages
            label: Digitale Stadt
            query: page.childrenAndDrafts.filterBy("topic", "digitale-stadt")
            status: all
            templates: project
            create: project
            sortable: true
            empty: Noch keine Projekte in diesem Themenfeld
          topic_teilhabe:
            type: pages
            label: Teilhabe & Barrierefreiheit
            query: page.childrenAndDrafts.filterBy("topic", "teilhabe")
            status: all
            templates: project
            create: project
            sortable: true
            empty: Noch keine Projekte in diesem Themenfeld
          topic_klima:
            type: pages
            label: Klima & Nachhaltigkeit
            query: page.childrenAndDrafts.filterBy("topic", "klima")
            status: all
            templates: project
            create: project
            sortable: true
            empty: Noch keine Projekte in diesem Themenfeld
          topic_ehrenamt:
            type: pages
            label: Ehrenamt & Engagement
            query: page.childrenAndDrafts.filterBy("topic", "ehrenamt")
            status: all
            templates: project
            create: project
            sortable: true
            empty: Noch keine Projekte in diesem Themenfeld
          topic_demokratie:
            type: pages
            label: Demokratie & Beteiligung
            query: page.childrenAndDrafts.filterBy("topic", "demokratie")
            status: all
            templates: project
            create: project
            sortable: true
            empty: Noch keine Projekte in diesem Themenfeld
          topic_kultur:
            type: pages
            label: Kunst, Kultur & Begegnung
            query: page.childrenAndDrafts.filterBy("topic", "kultur")
            status: all
            templates: project
            create: project
            sortable: true
            empty: Noch keine Projekte in diesem Themenfeld
          topic_haus:
            type: pages
            label: Das MachMit!Haus
            query: page.childrenAndDrafts.filterBy("topic", "haus")
            status: all
            templates: project
            create: project
            sortable: true
            empty: Noch keine Projekte in diesem Themenfeld
          topic_none:
            type: pages
            label: Ohne Themenfeld
            query: page.childrenAndDrafts.filterBy("topic", "")
            status: all
            templates: project
            create: project
            sortable: true
            empty: Alle Projekte sind einem Themenfeld zugeordnet

  settings:
    label: Einstellungen
    icon: cog
    fields:
      display_settings:
        label: Anzeigeoptionen
        type: headline

      show_active:
        label: Aktive Projekte (Hauptseite)
        help: Anzeige auf der MachMit!Projekte-Seite.
        type: toggle
        text:
          - "Nein"
          - "Ja"
        default: true

      show_archive:
        label: Archivierte Projekte (Hauptseite)
        help: Anzeige des Archivbereichs auf der MachMit!Projekte-Seite.
        type: toggle
        text:
          - "Nein"
          - "Ja"
        default: false

      show_search:
        label: Suchfeld im Archiv
        help: Anzeige des Suchfelds auf der Archivseite.
        type: toggle
        text:
          - "Nein"
          - "Ja"
        default: false

  archive:
    label: Projektarchiv
    icon: archive
    columns:
      - width: 1/1
        sections:
          archive_projects:
            extends: sections/projects
            label: Archivierte Projekte
            query: site.find("project-archive").childrenAndDrafts.merge(site.find("projects").childrenAndDrafts).filterBy("project_status", "abgeschlossen")
            status: all
            templates: project
            create: project
            sortable: true

  seo: tabs/seo
