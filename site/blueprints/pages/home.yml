# Each page blueprint must have a title, the title may be different from the file name
title: Home

# Each page can have an icon that is shown in page listings when no preview image is available.
icon: home

# Page options allow you to control how users can interact with the page.
# Here we prevent changing the page status (the home page cannot be renamed or deleted by default)
# More about page options: https://getkirby.com/docs/reference/panel/blueprints/page#options
options:
  changeStatus: false

tabs:
  content:
    label: Inhalt
    icon: text
    columns:
      - width: 1
        fields:
          cover:
            extends: fields/cover
      - width: 1/2
        fields:
          wellcomeHeadline:
            type: text
          wellcomeText:
            type: textarea
      - width: 1/2
        fields:
          info:
            type: info
            text: Den Newsletter Teaser kannst du <a href="/panel/site?tab=newsletter" target="_blank">hier</a> anpassen.
      - width: 1
        fields:
          oveda:
            extends: fields/oveda
      - width: 1
        fields:
          blocks:
            extends: fields/blocks

  cta_modal:
    label: CTA Modal
    icon: megaphone
    fields:
      cta_modal_enabled:
        type: toggle
        label: Modal beim Öffnen anzeigen
        text:
          - "Nein"
          - "Ja"
        default: false
      cta_modal_headline:
        type: text
        label: Überschrift
        when:
          cta_modal_enabled: true
      cta_modal_text:
        type: textarea
        label: Text
        when:
          cta_modal_enabled: true
      cta_modal_continue_text:
        type: text
        label: Button Text
        default: Weiter
        when:
          cta_modal_enabled: true
      cta_modal_continue_url:
        type: link
        label: Ziel Seite
        help: Externe URL oder interne Seite.
        when:
          cta_modal_enabled: true

  seo: tabs/seo
