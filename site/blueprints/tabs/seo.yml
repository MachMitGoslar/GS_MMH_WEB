label: SEO & Teilen
icon: search

columns:
  main:
    width: 2/3
    sections:
      seo:
        type: fields
        fields:
          seo_title:
            label: SEO Titel
            type: text
            placeholder: "{{ page.title }}"
            help: Überschreibt den Seitentitel in Suchergebnissen und beim Teilen. Leer lassen, um Titel bzw. Headline zu verwenden.
          seo_description:
            label: SEO Beschreibung
            type: textarea
            maxlength: 160
            counter: true
            buttons: false
            help: Wird in Suchergebnissen und in der Link-Vorschau angezeigt. Leer lassen, um automatisch aus dem Seiteninhalt zu erzeugen.
          social_image:
            label: Bild für Link-Vorschau
            type: files
            max: 1
            layout: cards
            query: page.images
            image:
              ratio: 1200/630
              cover: true
            uploads:
              template: image
            help: Wird auf 1200 × 630 px zugeschnitten. Leer lassen, um das Titelbild der Seite zu verwenden.

  sidebar:
    width: 1/3
    sections:
      preview:
        type: seo-preview
      visibility:
        type: fields
        fields:
          robots:
            label: Suchmaschinen
            type: select
            empty: true
            placeholder: Automatisch
            options:
              index: Indexieren
              noindex: Nicht indexieren
            help: "Automatisch: Unterseiten von nicht indexierten Seiten sowie unveröffentlichte Seiten bleiben aus dem Index."
